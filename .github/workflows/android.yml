name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL_TAG: release-2.30.12
  MOD_VERSION: 0.9.1

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get SDL2
        run: |
          git clone --depth 1 -b "$SDL_TAG" https://github.com/libsdl-org/SDL.git android/app/jni/SDL
          # The Java side must match the C side exactly: always take it from the same SDL copy
          cp android/app/jni/SDL/android-project/app/src/main/java/org/libsdl/app/*.java android/app/src/main/java/org/libsdl/app/

      - name: Build APK
        working-directory: android
        run: |
          NDK_VER=$(grep Pkg.Revision "$ANDROID_NDK_LATEST_HOME/source.properties" | cut -d= -f2 | tr -d ' ')
          echo "Using NDK $NDK_VER"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PndkVer="$NDK_VER" \
            -PmodVersionCode=${{ github.run_number }} \
            -PmodVersionName="$MOD_VERSION-b${{ github.run_number }}"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/MasterOfDarkness-$MOD_VERSION-b${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Master of Darkness ${{ env.MOD_VERSION }} (build ${{ github.run_number }})
          body: |
            APK de prueba compilado automáticamente desde `${{ github.sha }}`.
            No incluye la ROM: al abrir la app por primera vez se te pedirá que elijas tu copia de Master of Darkness (.sms).
          files: dist/*.apk

  desktop-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build
      - run: cmake -S . -B build -G Ninja && cmake --build build
