apply plugin: 'com.android.application'

android {
    namespace "com.juanmote.masterofdarkness"
    compileSdkVersion 34
    if (project.hasProperty('ndkVer')) {
        ndkVersion project.ndkVer
    }
    defaultConfig {
        applicationId "com.juanmote.masterofdarkness"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode Integer.parseInt(project.findProperty('modVersionCode') ?: '1')
        versionName project.findProperty('modVersionName') ?: '0.1.0'
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_APP_PLATFORM=android-21", "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
    signingConfigs {
        // Release key (1.0.4): it is NOT in the repository. The GitHub build takes it from the repository
        // Secrets (MOD_KEYSTORE_B64 and MOD_KEYSTORE_PASSWORD, see .github/workflows/android.yml), so nobody
        // else can sign an APK that installs over the official one. A build without it (a fork, a local
        // build) gets the usual debug key: it works, but it can never update the official app.
        mod {
            def ks = System.getenv('MOD_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('MOD_KEYSTORE_PASSWORD')
                keyAlias 'mod'
                keyPassword System.getenv('MOD_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('MOD_KEYSTORE_FILE') ? signingConfigs.mod : signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
